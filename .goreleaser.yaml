# GoReleaser config - https://goreleaser.com
# Verify locally: goreleaser check && goreleaser release --snapshot --clean
version: 2

project_name: asgard-fde-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: asgard-cli
    binary: asgard-cli
    main: ./cmd/asgard-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/asgard-ai-platform/asgard-fde-cli/internal/version.version={{ .Version }}
      - -X github.com/asgard-ai-platform/asgard-fde-cli/internal/version.commit={{ .FullCommit }}
      - -X github.com/asgard-ai-platform/asgard-fde-cli/internal/version.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# **One binary for both Macs.** A tar.gz per architecture makes the person
# downloading it decide whether their Mac is Intel or Apple silicon, and the
# cost of getting it wrong is an exec format error rather than a message. The
# universal build is what the .pkg wraps, and `replace: false` keeps the
# per-architecture archives for anyone scripting against their names.
universal_binaries:
  - id: darwin-universal
    ids: [asgard-cli]
    replace: false
    name_template: asgard-cli

archives:
  - id: default
    ids: [asgard-cli, darwin-universal]
    # e.g. asgard-fde-cli_1.2.0_darwin_arm64.tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

# Linux packages. No extra credentials needed; the artifacts are attached to the
# GitHub Release alongside the archives.
nfpms:
  - id: packages
    ids: [asgard-cli]
    package_name: asgard-cli
    vendor: Asgard AI Partners
    homepage: https://github.com/asgard-ai-platform/asgard-fde-cli
    maintainer: Asgard AI Partners <service@asgard-ai.com>
    description: Command line tool for Asgard FDE.
    license: Proprietary
    formats:
      - deb
      - rpm
      - apk
checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# The repository is public, and so is every release of it: the page, the notes
# and every asset below are reachable with no account, which is what lets
# `install.sh` and the version-less URLs work with a plain curl. Nothing here is
# published anywhere else, so the footer is the install instructions.
#
# **The footer is read by somebody installing a binary, and nothing else belongs
# in it.** v0.1.0 shipped with a paragraph in it explaining why the download
# pattern is spelled out rather than templated - true, useful, and addressed to
# whoever edits this file. It is a comment now, which is where a note to a
# maintainer goes:
#
#   the download pattern below is written out per-platform rather than as
#   `{{ .Os }}`/`{{ .Arch }}`, because release notes are rendered ONCE for the
#   whole release - those fields are artifact-scoped and are not in scope here.
#   A footer referencing them fails at publish time, which is a tag you cannot
#   take back, and neither `goreleaser check` (schema only) nor a snapshot
#   (`--skip=publish`) renders the footer at all.
release:
  prerelease: auto
  footer: |
    ## Install

    On a Mac, one command - it verifies the download against the checksums
    below and gets the first-run scan over with:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/asgard-ai-platform/asgard-fde-cli/main/install.sh | sh
    ```

    By hand, or on another platform - the URL carries no version, so it keeps
    working:

    ```bash
    curl -fsSL https://github.com/asgard-ai-platform/asgard-fde-cli/releases/latest/download/asgard-cli_darwin_all.tar.gz \
      | tar xz asgard-cli
    sudo install -m 0755 asgard-cli /usr/local/bin/asgard-cli
    asgard-cli doctor
    ```

    Swap `darwin_all` for `linux_amd64`, `linux_arm64` or `windows_amd64`.
    `darwin_all` serves both Intel and Apple silicon, so there is nothing to
    choose on a Mac.

    On Debian or RPM hosts the `.deb` and `.rpm` below install the same
    binary, and on a Mac the `.pkg` puts it on your PATH by double-clicking.

    ### On a Mac, do not download it in a browser

    **A browser marks the file, and macOS then kills it with no message at
    all** - no dialog, no error, exit code 137, and sometimes the file is gone
    from disk. It looks exactly like a broken program. The binaries here are
    ad-hoc signed, which is what Go's linker does so they can run at all, and
    they are not notarized.

    `gh` and `curl` do not mark the file, which is why the command above works.
    If you already have a copy that was downloaded in a browser, or that
    somebody sent you, clear the mark and it runs:

    ```bash
    xattr -d com.apple.quarantine ./asgard-cli    # or the .pkg
    ```

    ### Or from source, if you already build Go

    ```bash
    go install github.com/asgard-ai-platform/asgard-fde-cli/cmd/asgard-cli@{{ .Tag }}
    ```

    {{ if .PreviousTag }}**Full diff**: https://github.com/asgard-ai-platform/asgard-fde-cli/compare/{{ .PreviousTag }}...{{ .Tag }}{{ end }}
