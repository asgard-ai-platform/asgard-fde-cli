name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # **Every platform the release builds for compiles here, even the ones
      # nothing runs here.** `replace_windows.go` is behind a build tag, so a
      # break in it is invisible to every step above and would surface as a
      # release nobody can build.
      - name: the other platforms still compile
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin  GOARCH=arm64 go vet ./...


  # **The platform-specific halves, run where they apply.** Replacing a running
  # binary is one rename on Unix and two on Windows, the install script is a
  # different script on each, and none of that is exercised by a Linux job -
  # `replace_windows.go` had never been RUN anywhere until this existed.
  #
  # Scoped to the packages that carry OS-specific behaviour rather than the
  # whole tree: the corpus and the checks over it are the same everywhere, and
  # running them three times says nothing the Linux job has not already said.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./internal/selfupdate/ ./internal/cli/ ./internal/scaffold/

      # The installer, run end to end into a scratch directory: it downloads
      # the newest release, verifies it and executes what it got. It is the
      # only thing that checks the asset name this platform asks for against
      # the asset the release actually carries.
      - name: install.ps1 installs the newest release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          ASGARD_INSTALL_DIR: ${{ runner.temp }}\asgard-cli-install
        run: ./install.ps1

      - name: install.sh installs the newest release
        if: matrix.os == 'macos-latest'
        run: |
          set -eu
          dir="${RUNNER_TEMP}/asgard-cli-install"
          mkdir -p "$dir"
          sed "s|^dir=/usr/local/bin$|dir=$dir|" install.sh > "${RUNNER_TEMP}/install.sh"
          sh "${RUNNER_TEMP}/install.sh"


  material:
    # The corpus gates. **A flag that is not wired here is not enforced**, and
    # that is how six documents came to name a command nobody had built.
    #
    # --urls is deliberately not here: it fetches every docs.asgard-ai.com link
    # and a third party's outage is not this repository's build failure.
    # --orphans is not here either, and on purpose: it does not fail, because
    # a document reached only by search is still reached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: every document pointer resolves
        run: go run ./cmd/asgard-cli audit-material --links

      - name: every command this material names exists
        run: go run ./cmd/asgard-cli audit-material --commands

      - name: every document named has a way to reach it
        run: go run ./cmd/asgard-cli audit-material --bare

      - name: no landed document points at a file only this repository has
        run: go run ./cmd/asgard-cli audit-material --paths

      - name: every document says what it was held against
        run: go run ./cmd/asgard-cli audit-material --unverified

      - name: one upstream, one commit
        run: go run ./cmd/asgard-cli audit-material --sources

      - name: this repo's own documents name no path or symbol that is gone
        run: go run ./hack doc-paths

      - name: TASK.md's pass names every check, and no maintenance skill ships
        run: |
          go build -o .out/asgard-cli ./cmd/asgard-cli
          go run ./hack pass-list

      - name: Goal.md's four points, against the binary
        run: go run ./hack goal

      - name: every alias term is a word the corpus uses
        run: go run ./hack aliases

      - name: nothing that mounts a database leaves allowWrite unwritten
        run: go run ./hack write-path

      # The indexes are rendered from what each document declares about itself,
      # so a page added without a `group:` is a page no index lists, and a
      # description edited without re-rendering leaves the two disagreeing.
      # Needs nothing but this repository, which is why it belongs here.
      - name: both indexes match the documents they list
        run: go run ./hack index

      # `go run ./hack tables`, `processors`, `counts`, `coverage` and
      # `validate-crs` are deliberately absent: every one needs a clone of somebody else's
      # repository, and asgard-core is private. They are in the maintainer's
      # gate - `go run ./hack pass` prints it - and `go run ./hack sources` says
      # when one is due.


  build:
    # **Only on main.** Cross-compiling every platform through GoReleaser takes
    # three minutes where the rest of CI takes forty seconds, and on a pull
    # request it answers a question `test` has already answered: whether the
    # code compiles. What it uniquely checks - that the GoReleaser config is
    # still valid and every target still links - cannot be broken by a change
    # that `test` passes without also breaking the merge commit, and that is
    # where this runs.
    #
    # So a pull request gets the fast half and main gets both. `make snapshot`
    # is the same build on a laptop when a change touches .goreleaser.yaml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
